name: eaternity

services:
  app:
    image: matthew552/eaternity:latest
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    environment:
      MONGODB_URI: mongodb://mongo:27017/eaternity
      PUBLIC_URL: ${PUBLIC_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eaternity.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-usd}
      PAYMENT_EXCHANGE_RATE: ${PAYMENT_EXCHANGE_RATE:-1}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - app-data:/data
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  app-data:
  mongo-data:
